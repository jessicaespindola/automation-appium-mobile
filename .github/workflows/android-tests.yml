name: Android Appium Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-tests:
    name: Appium + WDIO (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_DEVICE_NAME: Pixel_API_30
      ANDROID_PLATFORM_VERSION: '11.0'
      ANDROID_UDID: emulator-5554
      ANDROID_LANGUAGE: en
      ANDROID_LOCALE: US
      APPIUM_PORT: '4730'
      APPIUM_HOME: ${{ github.workspace }}/.appium
      LOG_LEVEL: warn
      ALLURE_OPEN: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm ci

      - name: Download Native Demo App APK
        run: npm run app:download

      - name: Enable KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -eu
            echo "Devices:"
            adb devices -l
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "APPIUM_HOME=$APPIUM_HOME"
            npm test

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: |
            reports/allure-report
            reports/allure-results
            reports/failures
            reports/appium.log
          if-no-files-found: warn
          retention-days: 14
